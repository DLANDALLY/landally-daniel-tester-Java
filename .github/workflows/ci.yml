name: Java 8 CI with SonarQube

on:
  push:
    branches: [ "**" ] # Déclenche sur toutes les branches pour tes tests
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Désactive les clones superficiels pour une meilleure analyse Sonar

      # BONNE PRATIQUE : On installe Java 8 ET Java 17
      - name: Set up Java Environments (8 and 17)
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
          distribution: 'temurin'

      # Caches optimisés suggérés par SonarQube
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # ÉTAPE 1 : Compilation et Tests en Java 8 (Strict respect du projet)
      - name: Build and Run Tests with Java 8
        run: mvn clean test package -Djava.version=1.8
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }} # On force Maven à utiliser Java 8

      # ÉTAPE 2 : Analyse SonarQube avec Java 17 (Requis par le scanner)
      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }} # On bascule sur Java 17 uniquement pour l'envoi du rapport
        run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=DLANDALLY_landally-daniel-tester-Java -Dsonar.host.url=https://sonarcloud.io