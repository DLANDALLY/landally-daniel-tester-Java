name: Java 8 CI with SonarQube & GCP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requis par SonarQube pour l'analyse Git

      - name: Set up JDK 8 (pour le build) & JDK 17 (pour Sonar)
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests & Build
        # On force l'utilisation de Java 8 pour compiler l'application
        run: mvn clean test package -Djava.version=1.8
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}

#      - name: SonarQube Analysis
